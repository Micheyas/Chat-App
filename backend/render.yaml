services:
  - type: web
    name: chat-app-backend
    env: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 10000
      - key: ALLOWED_ORIGINS
        value: https://chat-app-frontend.onrender.com,https://your-frontend-url.vercel.app
    plan: free
    autoDeploy: false
